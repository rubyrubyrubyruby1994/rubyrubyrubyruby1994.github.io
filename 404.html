<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>No signal</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js" defer></script>
</head>
<!-- GitHub Pages shows this for any address that doesn't exist, so wrong guesses stay in the world. -->
<body data-time="night" data-fixed>
  <main class="set">
    <div class="screen">
      <canvas class="static" aria-hidden="true"></canvas>
      <section class="slate" data-show="night">
        <p class="big">Nothing is broadcasting on this channel.</p>
      </section>
    </div>
  </main>
</body>
</html>
